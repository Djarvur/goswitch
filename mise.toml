# Single source of tool versions for local development and CI (plan 01-05).
# D-09: mise tasks replace a Makefile; tools install per-project via `mise install`.
[tools]
go = "1.23"
golangci-lint = "2"

[env]
# Deterministic build/test paths
GOFLAGS = "-trimpath"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run all tests with race detector"
run = "go test -race -count=1 ./..."

[tasks.lint]
description = "Run golangci-lint v2 with strict config"
run = "golangci-lint run"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.tidy-diff]
description = "go mod tidy and fail on any go.mod/go.sum drift"
run = "go mod tidy && git diff --exit-code -- go.mod go.sum"

[tasks.ci]
description = "Full CI gate: build + vet + lint + test (D-08)"
depends = ["build", "vet", "lint", "test"]

# Live-session e2e cases (D-09): they drive the owner's desktop —
# deliberately NOT part of `mise run ci` (headless CI cannot run them).
[tasks.e2e-m1]
description = "e2e: M1 gate case (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case m1-gate"

[tasks.e2e-ibus-restart]
description = "e2e: INTEG-04 — ibus-daemon restart survival (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case ibus-restart"

[tasks.e2e-kill9-survive]
description = "e2e: INTEG-05 — kill -9 daemon, desktop input alive, respawn (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case kill9-survive"

[tasks.e2e-d01]
description = "e2e: D-01 probe matrix — source-switch experiment, appends verdicts to docs/adr/d01-experiment-log.md (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case d01-probe"

[tasks.e2e-chromium-smoke]
description = "e2e: 02-02 chromium surface smoke — fresh-instance driver proof (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case chromium-smoke"

[tasks.e2e-gte-smoke]
description = "e2e: 02-02 gnome-text-editor surface smoke — standalone-instance driver proof (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case gte-smoke"

[tasks.e2e-word]
description = "e2e: 02-03 word-correction tracer — ghbdtn→привет in zenity (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case word-en-ru"

[tasks.e2e-word-space]
description = "e2e: 02-03 word-after-space D-13 geometry — ghbdtn␠→привет␠ in zenity (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case word-after-space"

[tasks.e2e-word-ru]
description = "e2e: 02-04 RU→EN correction — flip→RU typing привет→double tap→ghbdtn in zenity (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case word-ru-en"

[tasks.e2e-word-mixed]
description = "e2e: 02-04 mixed word D-16 — gfbпривет untouched after double tap in zenity (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case word-mixed"

[tasks.e2e-phrase]
description = "e2e: 03-01 phrase tracer — ghbdtn ghbdtn→привет привет by triple Right Shift in zenity (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case phrase-en-ru"

[tasks.e2e-ladder-chromium]
description = "e2e: 02-05 ladder actual level in chromium — ghbdtn→привет, level+verify-after pinned from -debug log (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case ladder-chromium"

[tasks.e2e-reset-escape]
description = "e2e: 02-05 CORR-09 reset by Escape — ghbdtn kept untouched, empty-buffer refusal in the log (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -case reset-escape"

[tasks.e2e-matrix]
description = "e2e: 02-06 YAML case matrix v1 — per-case fresh daemon, PASS/FAIL report, e2e-report.txt (live GNOME session; NOT in ci)"
run = "go run ./test/e2e -matrix test/e2e/cases/matrix-v1.yaml"
