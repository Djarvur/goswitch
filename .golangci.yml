# golangci-lint v2 strict configuration
# Adapted from the owner's reference config (ass-guard-agent, D-10).
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: "5m"
  modules-download-mode: "readonly"

linters:
  default: all
  disable:
    - wsl            # Deprecated (v2.2.0); replaced by wsl_v5
    - wsl_v5         # House style of the reference config; same verdict as the wsl disable
    - gomodguard     # Deprecated (v2.12.0); replaced by gomodguard_v2
    - gomodguard_v2  # Same deprecated+renamed pair; the module allows exactly godbus
    - noinlineerr    # Contradicts the inline-err style of the reference config
    - modernize      # New gopls checks never vetted by this gate
    - nonamedreturns # The D-Bus recover shim (INTEG-05) requires named returns
                    # to guarantee zero-value replies after a contained panic

  settings:
    depguard:
      rules:
        Main:
          list-mode: lax
          deny:
            - pkg: "unsafe"
              desc: "unsafe breaks the memory-safety of a daemon that handles keystrokes"
    gocyclo:
      min-complexity: 20
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 30
    varnamelen:
      min-name-length: 1
      ignore-names:
        - i
        - j
        - k
        - v
        - r
        - w
        - id
        - ok
        - err
        - ctx
        - t
        - db
        - tc
        - ch
        - fr
    lll:
      line-length: 120
      tab-width: 4
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        hugeParam:
          # Config is the one-shot registration payload (240 bytes); copying
          # it once per Run call is irrelevant, so the 80-byte default only
          # forces pointer plumbing through the plan-pinned Run signature.
          sizeThreshold: 512
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: var-naming
    dupl:
      threshold: 120
    nestif:
      min-complexity: 6
    prealloc:
      simple: true
      for-loops: true

  exclusions:
    # Generated code (plan 01-02 layouts/tables.go carries a DO-NOT-EDIT marker
    # as its first line before `package`) is skipped automatically — no
    # per-path exclusions for generatedata are introduced.
    generated: strict
    presets:
      - common-false-positives
    paths:
      - "vendor"
      - "third_party"
    rules:
      # Relax errcheck in test files for common patterns
      - linters: [errcheck]
        path: ".*_test\\.go"
        text: ".*(defer .*\\.Close|defer .*\\.Rollback|fmt\\.Fprint|os\\.Setenv)"
      # Relax unparam in test code
      - linters: [unparam]
        path: ".*_test\\.go"
      # Relax dupl in test fixtures
      - linters: [dupl]
        path: ".*_test\\.go"
      # Relax gosec in test code
      - linters: [gosec]
        path: ".*_test\\.go"
      # Relax exhaustruct everywhere (too noisy for structs with optional fields)
      - linters: [exhaustruct, exhaustruct_v5]
        text: ".*"
      # Allow unchecked errors in main() init paths
      - linters: [errcheck]
        path: "cmd/.*"
        text: ".*(fmt\\.Println|os\\.Exit|log\\.Fatal)"
      # Reconnect-backoff jitter is timing, not a secret — math/rand/v2 is correct here
      - linters: [gosec]
        path: "engine/conn\\.go"
        text: "G404"
      # Address files are enumerated by os.ReadDir from the fixed IBus config
      # dir — not attacker-controlled user input
      - linters: [gosec]
        path: "engine/address\\.go"
        text: "G703"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - "github.com/Djarvur/goswitch"
