  - {type: "Ghbdtn"}
expect_text: "Ghbdtn"  # the x11 actual: transit verbatim
---
name: x11-phrase
surface: chromium-x11
mode: en
steps:
  - {type: "ghbdtn ghbdtn"}
expect_text: "ghbdtn ghbdtn"  # the x11 actual at phrase width: pure transit
