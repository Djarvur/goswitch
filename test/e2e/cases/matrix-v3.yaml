expect_text: "ghbdtn"  # the x11 ACTUAL (04-05 spike): typing transits verbatim — the x11 input context never services the surrounding protocol, so nothing can rewrite the field; the row FAILS loudly if the x11 IM path ever starts intercepting text
---
