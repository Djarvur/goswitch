# e2e-matrix — живая YAML-матрица на столе владельца (D-19, TEST-04).
#
# По умолчанию прогоняет матрицу v2 (03-07, критерий №5 фазы 3: полная
# широта жестов — фразы/выделение/комбо/reload/MACR); path-инпут
# сохраняет v1-регрессию (явное указание файла v1 запускает mise-задачу
# v1). Обе задачи — те же, что и локальный цикл (D-09 — CI вызывает ровно
# те же задачи, что и владелец; прецедент pr-sanity.yml). Отчёт
# дублируется в e2e-report.txt и выгружается артефактом при любом исходе
# (if: always()).
#
# Триггер — ТОЛЬКО workflow_dispatch, сознательно (T-02-07-01). Раннер
# живёт ВНУТРИ графической сессии владельца, стенд печатает на живом
# столе: событие из форка или ветки никогда не должно уметь его запустить.
# Диспатчить могут только роли с правом write.
#
# Один прогон за раз (Pitfall 8): concurrency-группа e2e-gnome БЕЗ
# cancel-in-progress — второй диспатч встаёт в очередь, а не отменяет
# бегущий; два стенда, печатающие на одном столе, запрещены планом.
#
# Сам раннер ставится по docs/ci-runner.md (self-hosted, ярлык gnome,
# systemd user unit внутри графической сессии).
name: e2e-matrix

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "matrix file to run (v2 default; v1 keeps the regression path)"
        default: test/e2e/cases/matrix-v2.yaml
        type: string

# Минимальные права токена (T-02-07-01); секретов workflow не использует.
permissions:
  contents: read

concurrency:
  group: e2e-gnome
  cancel-in-progress: false

jobs:
  e2e:
    name: matrix (live GNOME session)
    runs-on: [self-hosted, gnome]
    # Watchdog кейса — 180 с; 21 кейс v2 + сборка демона укладываются
    # с запасом. Потолок защищает стол от зависшего прогона.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Официальный инсталлятор mise (прецедент pr-sanity: mise.run —
      # каноническая точка раздачи jdx/mise; contents: read, без секретов).
      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ставит go и golangci-lint ровно в версиях из mise.toml —
      # единственное место версий инструментов (D-09/D-11).
      - name: Install tools from mise.toml
        run: mise install

      # Локальный и CI-прогон — одна и та же задача (D-09). Path-инпут
      # выбирает задачу: v1-файл — v1-регрессия, иначе v2 (дефолт).
      # Код выхода ≠ 0 при любом FAIL — job краснеет (TEST-04).
      - name: e2e matrix (${{ inputs.matrix }})
        run: |
          if [ "${{ inputs.matrix }}" = "test/e2e/cases/matrix-v1.yaml" ]; then
            mise run e2e-matrix
          else
            mise run e2e-matrix-v2
          fi

      # Отчёт — даже с упавшего прогона: FAIL-строки и есть диагностика.
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.txt
